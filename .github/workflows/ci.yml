name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: "pip"
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Lint with Ruff
      run: |
        ruff check src/ tests/ run_pipeline.py
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Smoke test pipeline (no data)
      run: |
        # Quick syntax/import check
        python -c "import src.data_prep; import src.encoding; import src.feature_selection; import src.models; import src.evaluate; import src.decisioning; import src.expected_loss; import src.explain; import src.monitoring; import src.model_card; print('All imports OK')"
    
    - name: Check required files exist
      run: |
        test -f config.yaml
        test -f requirements.txt
        test -f run_pipeline.py
        test -d src
        test -d tests